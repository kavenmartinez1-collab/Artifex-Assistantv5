name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Install the CPU builds of the SAME versions requirements.txt pins.
      # torch 2.6.0+cpu satisfies its torch==2.6.0, so pip doesn't then pull
      # the multi-GB CUDA build on top: unpinned, the two builds together
      # filled the runner's disk ("No space left on device", 2026-10-28).
      # Pipeline tests still import torch, so it must be present.
      - name: Install PyTorch (CPU-only)
        run: pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests
        run: pytest

      # ── WebGPU TypeScript type-checking ──────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webgpu/package-lock.json

      # `npm ci` installs the lockfile exactly and fails if it has drifted.
      # No `|| npm install` fallback: that would silently re-resolve version
      # ranges and run lifecycle scripts — the exact path supply-chain worms
      # rely on. A lockfile problem should fail the build, not route around it.
      - name: Install WebGPU dependencies
        working-directory: webgpu
        run: npm ci --ignore-scripts

      - name: TypeScript strict type-check
        working-directory: webgpu
        run: npx tsc --noEmit
