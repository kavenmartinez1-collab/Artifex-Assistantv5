<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Artifex Control Center</title>
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">ARTIFEX</span>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-btn active" data-panel="services">
        <span class="sidebar-icon">&#9654;</span>
        Services
      </button>
      <button class="sidebar-btn" data-panel="logs">
        <span class="sidebar-icon">&#9776;</span>
        Logs
      </button>
      <button class="sidebar-btn" data-panel="quantize">
        <span class="sidebar-icon">&#9881;</span>
        Quantize
      </button>
      <button class="sidebar-btn" data-panel="cluster">
        <span class="sidebar-icon">&#9733;</span>
        Cluster
      </button>
      <button class="sidebar-btn" data-panel="models">
        <span class="sidebar-icon">&#9744;</span>
        Models
      </button>
      <button class="sidebar-btn" data-panel="docker">
        <span class="sidebar-icon">&#9850;</span>
        Docker
      </button>
    </nav>
    <div class="sidebar-footer">
      <span class="sidebar-version">v0.1.0</span>
    </div>
  </div>

  <div id="content">
    <div id="panel-services" class="panel active"></div>
    <div id="panel-logs" class="panel"></div>
    <div id="panel-quantize" class="panel">
      <div class="panel-placeholder">Quantization panel coming in Phase 3</div>
    </div>
    <div id="panel-cluster" class="panel">
      <div class="panel-placeholder">Cluster panel coming in Phase 4</div>
    </div>
    <div id="panel-models" class="panel">
      <div class="panel-placeholder">Models panel coming in Phase 5</div>
    </div>
    <div id="panel-docker" class="panel">
      <div class="panel-placeholder">Docker panel coming in Phase 6</div>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-services">Services: --</span>
    <span id="status-time"></span>
  </div>

  <script src="./components/service-card.js"></script>
  <script src="./components/log-line.js"></script>
  <script src="./panels/services-panel.js"></script>
  <script src="./panels/logs-panel.js"></script>
  <script src="./app.js"></script>
</body>
</html>
